                          {move ? <MoveTile minimal move={move} /> : <span className="text-red-400 text-xs">Unknown Move</span>}
                        </React.Fragment>;
                      }) : <span className="text-slate-500 text-sm italic">クリックでコンボを入力。</span>}
                      {block.dmg && <span className="text-xs text-white font-semibold ml-1">dmg: {block.dmg}</span>}
                    </div>
                    {(block.situation || block.selectionSituation) && (
                      <div className="text-xs text-white mt-2 break-words">
                        {block.situation && <span className="mr-3"><span className="opacity-80">コンボ後の状況:</span> {block.situation}</span>}
                        {block.selectionSituation && <span><span className="opacity-80">選択場面:</span> {block.selectionSituation}</span>}
                      </div>
                    )}
                  </button>
                ) : (
                  <AutoExpandingTextarea
                    value={block.content || ''}
                    onChange={event => {
                      const value = event.target.value;
                      callbacksRef.current.onChange(blocksRef.current.map(item => item.id === block.id ? { ...item, content: value } : item));
                      rememberCursor(block, event);
                    }}
                    onClick={event => rememberCursor(block, event)}
                    onKeyUp={event => rememberCursor(block, event)}
                    onSelect={event => rememberCursor(block, event)}
                    placeholder="文章を入力..."
                    className="w-full min-w-0 bg-transparent text-slate-200 border-none focus:ring-0 p-2 hover:bg-slate-800/30 focus:bg-slate-800/50 rounded transition-colors text-sm whitespace-pre-wrap"
                  />
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function CardEditor({ card, moves, db, appId, user, onMove, isFirst, isLast, applyLocalWrite, stageCard }) {
      const [editingBlock, setEditingBlock] = useState(null);
      const initialBlocks = Array.isArray(card.blocks) ? card.blocks : [];
      const [blocks, setBlocks] = useState(initialBlocks);
      const blocksRef = useRef(initialBlocks);
      const saveTimerRef = useRef(null);
      const latestJsonRef = useRef(JSON.stringify(initialBlocks));
      const savedJsonRef = useRef(JSON.stringify(initialBlocks));
      const deletedRef = useRef(false);
      const ioRef = useRef({ db, appId, user, cardId: card.id, applyLocalWrite, stageCard });
      ioRef.current = { db, appId, user, cardId: card.id, applyLocalWrite, stageCard };

      // Sending a write hands its responsibility to MainLayout. It survives
      // CardEditor being unmounted by a tab or character switch.
      const flushSave = () => {
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
        if (deletedRef.current || savedJsonRef.current === latestJsonRef.current) return;
        const json = latestJsonRef.current;
        savedJsonRef.current = json;
        const io = ioRef.current;
        io.applyLocalWrite('cards', doc(io.db, 'artifacts', io.appId, 'users', io.user.uid, 'cards', io.cardId), { blocks: JSON.parse(json) }, 'update');
      };
      const commitBlocks = (updater, immediate = false) => {
        const previous = blocksRef.current;
        const next = typeof updater === 'function' ? updater(previous) : updater;
        const json = JSON.stringify(next);
        if (json === latestJsonRef.current) return;
        blocksRef.current = next;
        latestJsonRef.current = json;
        setBlocks(next);
        ioRef.current.stageCard(card.id, next);
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        if (immediate) flushSave();
        else saveTimerRef.current = setTimeout(flushSave, 250);
      };
      const updateBlock = (blockId, patch, immediate = false) =>
        commitBlocks(previous => previous.map(block => block.id === blockId ? { ...block, ...patch } : block), immediate);
      const incomingJson = JSON.stringify(Array.isArray(card.blocks) ? card.blocks : []);
      useEffect(() => {
        if (incomingJson === latestJsonRef.current) return;
        if (latestJsonRef.current === savedJsonRef.current) {
          const incoming = Array.isArray(card.blocks) ? card.blocks : [];
          blocksRef.current = incoming;
          latestJsonRef.current = incomingJson;
          savedJsonRef.current = incomingJson;
          setBlocks(incoming);
        }
      }, [card.id, incomingJson]);
      useEffect(() => () => flushSave(), [card.id]);

      const [draftTitle, setDraftTitle] = useState(card.title || '');
      const titleTimerRef = useRef(null);
      const titleLatestRef = useRef(card.title || '');
      const titleSavedRef = useRef(card.title || '');
      const saveCardTitle = () => {
        if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
        titleTimerRef.current = null;
        if (deletedRef.current || titleLatestRef.current === titleSavedRef.current) return;
        titleSavedRef.current = titleLatestRef.current;
        const io = ioRef.current;
        io.applyLocalWrite('cards', doc(io.db, 'artifacts', io.appId, 'users', io.user.uid, 'cards', io.cardId), { title: titleLatestRef.current }, 'update');
      };
      useEffect(() => {
        if (document.activeElement?.getAttribute('data-card-title') !== card.id && titleLatestRef.current === titleSavedRef.current) {
          titleLatestRef.current = card.title || '';
          titleSavedRef.current = card.title || '';
          setDraftTitle(card.title || '');
        }
      }, [card.id, card.title]);
      useEffect(() => () => {
        if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
        saveCardTitle();
      }, [card.id]);

      const handleDeleteCard = async () => {
        if (!window.confirm('このカードを削除しますか？')) return;
        try {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
          if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
          deletedRef.current = true;
          applyLocalWrite('cards', doc(db, 'artifacts', appId, 'users', user.uid, 'cards', card.id), null, 'delete');
        }
        catch (err) { console.error(err); alert(`カードを削除できませんでした: ${err.message}`); }
      };

      const editorApi = useRef(null);
      const addBlock = (type) => {
        if (type === 'combo') {
          const newBlock = { id: createId(), type: 'combo', moveIds: [], state: 'ノーマル', dmg: '', situation: '', selectionSituation: '' };
          editorApi.current?.insertCombo(newBlock);
          setEditingBlock(newBlock);
        }
      };
      const handleSaveCombo = (updatedComboBlock) => {
        // Commit to React state and optimistic overlay synchronously.
        // The cloud write is queued, not awaited by the popup.
        updateBlock(updatedComboBlock.id, updatedComboBlock, true);
        setEditingBlock(null);
      };
      const safeBlocks = Array.isArray(blocks) ? blocks : [];

      return (
        <div className="bg-slate-900 border border-slate-700 rounded-xl shadow-lg overflow-hidden flex flex-col group relative">
          <div className="px-2 py-1 bg-slate-800/50 flex justify-between items-center">
            <input data-card-title={card.id} type="text" value={draftTitle}
              onChange={event => {
                const value = event.target.value;
                titleLatestRef.current = value;
                setDraftTitle(value);
                if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
                titleTimerRef.current = setTimeout(saveCardTitle, 250);
              }} onBlur={saveCardTitle}
              aria-label="カードタイトル" placeholder="タイトルを入力（任意）"
              className="min-w-0 flex-1 max-w-[80%] bg-transparent border-b border-transparent focus:border-cyan-500 outline-none text-xs md:text-sm text-white font-semibold placeholder:text-slate-500 px-1 py-1" />
            <div className="flex items-center gap-1">
              <button onClick={() => onMove(-1)} disabled={isFirst} className="p-1 text-slate-500 hover:text-cyan-400 rounded disabled:opacity-20" title="カードを上へ"><ChevronUp size={14}/></button>
              <button onClick={() => onMove(1)} disabled={isLast} className="p-1 text-slate-500 hover:text-cyan-400 rounded disabled:opacity-20" title="カードを下へ"><ChevronDown size={14}/></button>
              <button onClick={handleDeleteCard} className="p-1 text-red-400 hover:text-red-300 rounded" title="カードを削除"><Trash2 size={14}/></button>
            </div>
          </div>
          <div className="p-3 md:p-4">
            <RichComboDocument blocks={safeBlocks} moves={moves} onChange={next => commitBlocks(next)}
              onEditCombo={block => setEditingBlock(block)} editorApi={editorApi} />
          </div>
          <div className="bg-slate-950/30 p-2 border-t border-slate-800 flex justify-center space-x-2">
            <button onMouseDown={e => e.preventDefault()} onClick={() => addBlock('combo')} className="px-3 py-1.5 text-xs font-medium text-cyan-400 hover:text-cyan-200 bg-cyan-950 hover:bg-cyan-900 rounded-md border border-cyan-800/50 transition-colors flex items-center"><Sword size={12} className="mr-1.5" /> コンボを挿入</button>
          </div>
          {editingBlock && editingBlock.type === 'combo' && <ComboBuilderModal isOpen={true} onClose={() => setEditingBlock(null)} initialData={editingBlock} onSave={handleSaveCombo} moves={moves} />}
        </div>
      );
    }

    function ComboBuilderModal({ isOpen, onClose, initialData, onSave, moves }) {
      const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
      const normalizeCombo = (data) => ({
        ...data,
        moveIds: Array.isArray(data.moveIds) ? data.moveIds : [],
        state: data.state === '通常' ? 'ノーマル' : (data.state || 'ノーマル'),
        dmg: data.dmg ?? '',
        situation: data.situation ?? '',
        selectionSituation: data.selectionSituation ?? ''
      });
      const [comboData, setComboData] = useState(() => normalizeCombo(initialData));
      useEffect(() => { setComboData(normalizeCombo(initialData)); }, [initialData.id]);
      if (!isOpen) return null;

      const currentCategoryMoves = moves.filter(m => m.category === activeCategory);
      const handleAddMove = (moveId) => setComboData(prev => ({ ...prev, moveIds: [...(Array.isArray(prev.moveIds) ? prev.moveIds : []), moveId] }));
      const handleRemoveMove = (index) => setComboData(prev => { const newIds = [...(Array.isArray(prev.moveIds) ? prev.moveIds : [])]; newIds.splice(index, 1); return { ...prev, moveIds: newIds }; });
      const handleChange = (e) => setComboData(prev => ({ ...prev, [e.target.name]: e.target.value }));
      const [isSaving, setIsSaving] = useState(false);
      const handleSubmitCombo = async () => {
        if (isSaving) return;
        setIsSaving(true);
        try {
          await onSave({ ...comboData, state: comboData.state === '通常' ? 'ノーマル' : comboData.state });
        } catch (error) {
          console.error('Combo save failed:', error);
          alert(`コンボを保存できませんでした: ${error.message}`);
        } finally { setIsSaving(false); }
      };

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="コンボ編集" maxWidth="max-w-3xl">
          <div className="flex flex-col h-[min(75vh,780px)] min-h-[400px]">
            <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 mb-4 shrink-0 shadow-inner">
              <div className="text-xs text-slate-500 mb-2 uppercase tracking-wide font-semibold">プレビュー</div>
              <div className="flex flex-wrap items-center gap-2 min-h-[40px]">
                {comboData.moveIds.length === 0 && <span className="text-slate-600 text-sm italic">Select moves below to build combo...</span>}
                {comboData.moveIds.map((mid, idx) => {
                  const move = moves.find(m => m.id === mid) || moves.find(m => m.overrideId === mid);
                  if (!move) return <div key={idx} onClick={() => handleRemoveMove(idx)} className="cursor-pointer group flex items-center"><span className="bg-red-900/50 text-red-200 px-2 py-1 rounded text-xs">Missing</span>{idx < comboData.moveIds.length - 1 && <ChevronRight size={14} className="text-slate-600 mx-1 group-hover:hidden" />}</div>;
                  return (
                    <React.Fragment key={idx}>
                      <div className="relative group cursor-pointer" onClick={() => handleRemoveMove(idx)} title="Click to remove">
                        <MoveTile minimal move={move} showMoveName />
                        <div className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity shadow-md"><X size={10} /></div>
                      </div>
                      {idx < comboData.moveIds.length - 1 && <ChevronRight size={16} className="text-slate-500" />}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
            <div className="flex-1 flex flex-col min-h-0 border border-slate-800 rounded-lg overflow-hidden mb-4">
              <div className="flex overflow-x-auto bg-slate-950 border-b border-slate-800 shrink-0">
                {CATEGORIES.map(cat => (
                  <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-3 py-2 text-xs font-medium whitespace-nowrap transition-colors ${activeCategory === cat ? 'bg-cyan-900/30 text-cyan-400 border-b-2 border-cyan-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>{cat}</button>
                ))}
              </div>
              <div className="flex-1 overflow-y-auto p-3 bg-slate-900/50">
                <div className="flex flex-wrap gap-2">
                  {currentCategoryMoves.map(move => <button key={move.id} onClick={() => handleAddMove(move.overrideId || move.id)} className={`px-3 py-1.5 rounded-md text-sm font-bold border shadow-sm transition-all hover:scale-105 active:scale-95 ${STRENGTH_COLORS[move.strength] || STRENGTH_COLORS['その他']}`}>{MOVE_NAME_CATEGORIES.includes(move.category) && move.moveName ? `${move.name}（${move.moveName}）` : move.name}</button>)}
                  {currentCategoryMoves.length === 0 && <div className="w-full text-center text-slate-500 text-sm py-4">No moves found in this category.</div>}
                </div>
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 shrink-0 pt-2 border-t border-slate-800 max-h-[200px] overflow-y-auto">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">ヒット</label>
                <select name="state" value={comboData.state === '通常' ? 'ノーマル' : (comboData.state || 'ノーマル')} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500 appearance-none">{COMBO_STATES.map(s => <option key={s} value={s}>{s}</option>)}</select>
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">ダメージ（任意）</label>
                <input type="text" name="dmg" value={comboData.dmg || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="" />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">コンボ選択場面（任意）</label>
                <input type="text" name="selectionSituation" value={comboData.selectionSituation || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="ex. 立ち確認、Dゲージ3本" />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">コンボ後の状況（任意）</label>
                <input type="text" name="situation" value={comboData.situation || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="ex. 2中P消費で+4F" />
              </div>
            </div>
            <div className="pt-3 mt-2 flex justify-end space-x-2 shrink-0">
              <button onClick={onClose} className="px-4 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">Cancel</button>
              <button onClick={handleSubmitCombo} disabled={isSaving} className="flex items-center px-4 py-2 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white transition-colors shadow-lg shadow-cyan-900/20"><Save size={16} className="mr-2" /> {isSaving ? 'Saving...' : 'Save Combo'}</button>
            </div>
          </div>
        </Modal>
      );
    }

    class DisplayErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('FG Tool render error:', error, info); }
      render() {
        if (!this.state.error) return this.props.children;
        return <div className="min-h-screen bg-slate-900 text-slate-200 flex items-center justify-center p-6"><div className="max-w-xl rounded-xl border border-red-700 bg-slate-950 p-6"><h1 className="text-xl font-bold text-red-400 mb-3">FG Tool 表示エラー</h1><p className="text-sm mb-3">表示処理でエラーが発生しました。以下の内容をお知らせください。</p><pre className="whitespace-pre-wrap break-all text-xs text-red-200">{String(this.state.error?.message || this.state.error)}</pre></div></div>;
      }
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<DisplayErrorBoundary><App /></DisplayErrorBoundary>);
  </script>
</body>
</html>
