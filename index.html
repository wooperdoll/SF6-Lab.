          }) : <span className="text-slate-500 text-sm italic">{isMain ? 'クリックでコンボを入力。' : '技を追加してください'}</span>}
          {dmg !== '' && dmg != null && validIds.length > 0 &&
            <span className="text-white text-xs font-semibold whitespace-nowrap">({dmg} dmg)</span>}
          {situation && <span className="text-white text-xs whitespace-nowrap">状況: {situation}</span>}
        </div>
        {childBranches.map((branch, index) => {
          const anchor = Math.max(0, Math.min(validIds.length, Number(branch.fromIndex) || 0));
          // Sibling order is independent of nesting depth.
          return <div key={branch.id || index} className="pt-1 pb-2 w-max"
            style={{ marginLeft: Math.max(0, (positions[anchor] ?? 0) - 2) }}>
            <div className="border-l-2 border-cyan-700/80 pl-2">
              <ComboRouteLane ids={branch.moveIds} moves={moves}
                title={branch.displayTitle} dmg={branch.dmg} situation={branch.situation}
                selectionSituation={branch.selectionSituation} children={branch.children} />
            </div>
          </div>;
        })}
      </div>;
    }

    function ComboRouteView({ block, moves, onClick }) {
      const branches = Array.isArray(block.branches) ? block.branches : [];
      const byParent = new Map();
      const branchIds = new Set(branches.map(b => b.id));
      branches.forEach(branch => {
        const parent = branch.parentId && branchIds.has(branch.parentId) && branch.parentId !== branch.id
          ? branch.parentId : 'main';
        if (!byParent.has(parent)) byParent.set(parent, []);
        byParent.get(parent).push(branch);
      });
      // Prevent a malformed cyclic parent graph from recursing forever.
      const seen = new Set();
      const createChildren = (parentId, ancestors = new Set()) => (byParent.get(parentId) || []).flatMap(branch => {
        if (ancestors.has(branch.id) || seen.has(branch.id)) return [];
        seen.add(branch.id);
        const nextAncestors = new Set(ancestors);
        nextAncestors.add(branch.id);
        return [{ ...branch, displayTitle: `↳ ${String(branch.title || '').trim() || `分岐${branches.indexOf(branch) + 1}`}`,
          children: createChildren(branch.id, nextAncestors) }];
      });
      const rootChildren = createChildren('main');
      return <div onClick={onClick} className="p-3 bg-slate-950 rounded-lg border border-slate-800 cursor-pointer hover:border-cyan-700 transition-all">
        <div className="character-scroll overflow-x-auto pb-1">
          <ComboRouteLane isMain ids={block.moveIds} state={block.state} moves={moves}
            dmg={block.dmg} situation={block.situation}
            selectionSituation={block.selectionSituation} children={rootChildren} />
        </div>
      </div>;
    }

    function CardEditor({ card, moves, db, appId, user, applyLocalWrite, stageCard, cardDragProps, isDragTarget }) {
      const [editingBlock, setEditingBlock] = useState(null);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const initialBlocks = Array.isArray(card.blocks) ? card.blocks : [];
      const [blocks, setBlocks] = useState(initialBlocks);
      const blocksRef = useRef(initialBlocks);
      const saveTimerRef = useRef(null);
      const latestJsonRef = useRef(JSON.stringify(initialBlocks));
      const savedJsonRef = useRef(JSON.stringify(initialBlocks));
      const deletedRef = useRef(false);
      const ioRef = useRef({ db, appId, user, cardId: card.id, applyLocalWrite, stageCard });
      ioRef.current = { db, appId, user, cardId: card.id, applyLocalWrite, stageCard };

      const [showCombo, setShowCombo] = useState(card.showCombo !== false);
      const [showText, setShowText] = useState(card.showText !== false);
      const visibilityRef = useRef({ showCombo: card.showCombo !== false, showText: card.showText !== false });
      const toggleVisibility = (field) => {
        const next = !visibilityRef.current[field];
        visibilityRef.current = { ...visibilityRef.current, [field]: next };
        if (field === 'showCombo') setShowCombo(next);
        else setShowText(next);
        applyLocalWrite('cards', doc(db, 'artifacts', appId, 'users', user.uid, 'cards', card.id), { [field]: next }, 'update');
      };
      useEffect(() => {
        const nextCombo = card.showCombo !== false;
        const nextText = card.showText !== false;
        visibilityRef.current = { showCombo: nextCombo, showText: nextText };
        setShowCombo(nextCombo);
        setShowText(nextText);
      }, [card.id, card.showCombo, card.showText]);

      const titleInitial = card.title ?? 'New Card';
      const [title, setTitle] = useState(titleInitial);
      const latestTitleRef = useRef(titleInitial);
      const savedTitleRef = useRef(titleInitial);
      const titleTimerRef = useRef(null);

      const flushSave = () => {
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
        if (deletedRef.current || savedJsonRef.current === latestJsonRef.current) return;
        const json = latestJsonRef.current;
        savedJsonRef.current = json;
        const io = ioRef.current;
        io.applyLocalWrite('cards', doc(io.db, 'artifacts', io.appId, 'users', io.user.uid, 'cards', io.cardId), { blocks: JSON.parse(json) }, 'update');
      };
      const flushTitle = () => {
        if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
        titleTimerRef.current = null;
        if (deletedRef.current || savedTitleRef.current === latestTitleRef.current) return;
        const newTitle = latestTitleRef.current.trim() || 'New Card';
        latestTitleRef.current = newTitle;
        savedTitleRef.current = newTitle;
        setTitle(newTitle);
        const io = ioRef.current;
        io.applyLocalWrite('cards', doc(io.db, 'artifacts', io.appId, 'users', io.user.uid, 'cards', io.cardId), { title: newTitle }, 'update');
      };
      const commitBlocks = (updater, immediate = false) => {
        const previous = blocksRef.current;
        const next = typeof updater === 'function' ? updater(previous) : updater;
        const json = JSON.stringify(next);
        if (json === latestJsonRef.current) return;
        blocksRef.current = next;
        latestJsonRef.current = json;
        setBlocks(next);
        ioRef.current.stageCard(card.id, next);
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        if (immediate) flushSave();
        else saveTimerRef.current = setTimeout(flushSave, 250);
      };
      const updateBlock = (blockId, patch, immediate = false) =>
        commitBlocks(previous => previous.map(block => block.id === blockId ? { ...block, ...patch } : block), immediate);
      const incomingJson = JSON.stringify(Array.isArray(card.blocks) ? card.blocks : []);
      useEffect(() => {
        if (incomingJson === latestJsonRef.current) return;
        if (latestJsonRef.current === savedJsonRef.current) {
          const incoming = Array.isArray(card.blocks) ? card.blocks : [];
          blocksRef.current = incoming;
          latestJsonRef.current = incomingJson;
          savedJsonRef.current = incomingJson;
          setBlocks(incoming);
        }
      }, [card.id, incomingJson]);
      useEffect(() => {
        const incomingTitle = card.title ?? 'New Card';
        if (latestTitleRef.current === savedTitleRef.current && incomingTitle !== latestTitleRef.current) {
          latestTitleRef.current = incomingTitle;
          savedTitleRef.current = incomingTitle;
          setTitle(incomingTitle);
        }
      }, [card.id, card.title]);
      useEffect(() => () => { flushSave(); flushTitle(); }, [card.id]);

      const handleDeleteCard = () => {
        if (deletedRef.current) return;
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
        deletedRef.current = true;
        setShowDeleteConfirm(false);
        applyLocalWrite('cards', doc(db, 'artifacts', appId, 'users', user.uid, 'cards', card.id), null, 'delete');
      };
      // Present a single textarea while retaining all legacy text content.
      // Legacy multi-text cards are consolidated only after the user edits the text.
      const updateCardText = (value) => commitBlocks(previous => {
        const first = previous.find(block => block.type === 'text');
        const others = previous.filter(block => block.type !== 'text');
        return [...others, { id: first?.id || createId(), type: 'text', content: value }];
      });
      const handleSaveCombo = updated => {
        commitBlocks(previous => {
          const index = previous.findIndex(b => b.type === 'combo' && b.id === updated.id);
          if (index !== -1) return previous.map(b => b.id === updated.id ? updated : b);
          // One new combo maximum per card. Existing legacy combos are kept
          // until the user explicitly splits them into separate cards.
          if (previous.some(b => b.type === 'combo')) return previous;
          return [updated, ...previous];
        }, true);
        setEditingBlock(null);
      };
      const safeBlocks = Array.isArray(blocks) ? blocks : [];
      const combos = safeBlocks.filter(b => b.type === 'combo');
      const combo = combos[0] || null;
      const oldCombos = combos.slice(1);
      const textBlocks = safeBlocks.filter(b => b.type === 'text');
      const fullText = textBlocks.map(b => b.content || '').join('\n\n');
      const openCombo = () => setEditingBlock(combo || { id: createId(), type: 'combo', moveIds: [], state: 'ノーマル', dmg: '', situation: '', selectionSituation: '' });

      const renderCombo = (block) => (
        <ComboRouteView key={block.id} block={block} moves={moves}
          onClick={() => setEditingBlock(block)} />
      );

      // Old cards may contain multiple combo blocks. Keep them visible rather
      // than silently deleting their data; provide an explicit split operation.
      const splitOldCombos = () => {
        if (!oldCombos.length) return;
        if (!window.confirm(`以前のコンボ${oldCombos.length}件を別カードに分割しますか？`)) return;
        oldCombos.forEach((legacy, index) => {
          const ref = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'cards'));
          applyLocalWrite('cards', ref, {
            title: 'New Card', memoId: card.memoId, showCombo: true, showText: true,
            blocks: [legacy, { id: createId(), type: 'text', content: '' }],
            order: Number(card.order || 0) + (index + 1) * 0.001
          });
        });
        commitBlocks(previous => previous.filter(b => !oldCombos.some(old => old.id === b.id)), true);
      };

      return (
        <div {...cardDragProps}
          className={`bg-slate-900 border rounded-xl shadow-lg overflow-hidden flex flex-col group relative ${isDragTarget ? 'border-cyan-400 ring-2 ring-cyan-500/50' : 'border-slate-700'}`}>
          <div className="px-2 py-1 bg-slate-800/50 flex justify-between items-center gap-2">
            <span draggable="true" aria-label="ドラッグしてカードを並べ替え" title="ドラッグしてカードを並べ替え"
              className="shrink-0 cursor-grab active:cursor-grabbing touch-none text-slate-500 hover:text-cyan-300 select-none px-1" onClick={e => e.stopPropagation()}>
              <GripVertical size={17} />
            </span>
            <input type="text" value={title} aria-label="カードのタイトル"
              onChange={e => {
                const value = e.target.value;
                setTitle(value); latestTitleRef.current = value;
                if (titleTimerRef.current) clearTimeout(titleTimerRef.current);
                titleTimerRef.current = setTimeout(flushTitle, 350);
              }}
              onBlur={flushTitle} placeholder="New Card"
              className="flex-1 min-w-0 text-sm font-semibold text-slate-100 bg-transparent hover:bg-slate-700/50 focus:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-cyan-600 rounded px-2 py-1" />
            <div className="flex items-center gap-1 shrink-0">
              <button type="button" onClick={() => toggleVisibility('showCombo')} aria-pressed={showCombo}
                className={`px-2 py-1 text-xs font-semibold rounded border transition-colors ${showCombo ? 'bg-cyan-900/70 text-cyan-200 border-cyan-700' : 'bg-slate-900 text-slate-500 border-slate-700'}`}>コンボ</button>
              <button type="button" onClick={() => toggleVisibility('showText')} aria-pressed={showText}
                className={`px-2 py-1 text-xs font-semibold rounded border transition-colors ${showText ? 'bg-cyan-900/70 text-cyan-200 border-cyan-700' : 'bg-slate-900 text-slate-500 border-slate-700'}`}>テキスト</button>
              <button onClick={() => setShowDeleteConfirm(true)} className="p-1 text-red-400 hover:text-red-300 rounded" title="カードを削除"><Trash2 size={14}/></button>
            </div>
          </div>
          {(showCombo || showText) && <div className="p-3 md:p-4 space-y-3 cursor-default">
            {showCombo && <>
              {combo ? renderCombo(combo) :
                <button type="button" onClick={openCombo} className="w-full p-3 text-left bg-slate-950 border border-dashed border-slate-700 rounded-lg text-slate-500 hover:border-cyan-600 text-sm">クリックでコンボを入力。</button>}
              {oldCombos.length > 0 && <div className="rounded-md border border-amber-800/50 bg-amber-950/20 p-2 space-y-2">
                <p className="text-xs text-amber-300">旧形式の追加コンボが{oldCombos.length}件あります。データ保護のため残しています。</p>
                {oldCombos.map(old => <div key={old.id}>{renderCombo(old)}</div>)}
                <button type="button" onClick={splitOldCombos} className="text-xs rounded bg-amber-900/40 hover:bg-amber-900/70 text-amber-200 px-2 py-1">別カードに分割する</button>
              </div>}
            </>}
            {showText && <div className="min-w-0 rounded bg-slate-950/40">
              <AutoExpandingTextarea value={fullText} onChange={e => updateCardText(e.target.value)}
                placeholder="クリックでテキストを入力。" className="w-full bg-transparent text-slate-200 border-none focus:ring-0 p-2 hover:bg-slate-800/30 focus:bg-slate-800/50 rounded transition-colors text-sm" />
            </div>}
          </div>}
          {editingBlock && <ComboBuilderModal isOpen={true} onClose={() => setEditingBlock(null)} initialData={editingBlock} onSave={handleSaveCombo} moves={moves} />}
          <Modal isOpen={showDeleteConfirm} onClose={() => setShowDeleteConfirm(false)} title="カードを削除">
            <div className="space-y-4">
              <p className="text-sm text-slate-200">「{title || 'New Card'}」を削除しますか？</p>
              <p className="text-xs text-red-300 leading-relaxed">このカードに含まれるコンボとテキストも削除されます。この操作は取り消せません。</p>
              <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={() => setShowDeleteConfirm(false)} className="px-4 py-2 rounded-md text-sm text-slate-300 hover:bg-slate-800">キャンセル</button>
                <button type="button" onClick={handleDeleteCard} className="px-4 py-2 rounded-md text-sm font-bold bg-red-600 hover:bg-red-500 text-white">削除する</button>
              </div>
            </div>
          </Modal>
        </div>
      );
    }

    function ComboBuilderModal({ isOpen, onClose, initialData, onSave, moves }) {
      const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
      const normalizeCombo = (data) => ({
        ...data,
        moveIds: Array.isArray(data.moveIds) ? data.moveIds : [],
        branches: Array.isArray(data.branches) ? data.branches.map(branch => ({
          ...branch,
          title: typeof branch.title === 'string' ? branch.title : '',
          id: branch.id || createId(),
          parentId: branch.parentId || 'main',
          fromIndex: Number.isFinite(Number(branch.fromIndex)) ? Number(branch.fromIndex) : (data.moveIds?.length || 0),
          moveIds: Array.isArray(branch.moveIds) ? branch.moveIds : [],
          dmg: branch.dmg ?? '', situation: branch.situation ?? '', selectionSituation: branch.selectionSituation ?? ''
        })) : [],
        state: data.state === '通常' ? 'ノーマル' : (data.state || 'ノーマル'),
        dmg: data.dmg ?? '', situation: data.situation ?? '', selectionSituation: data.selectionSituation ?? ''
      });
      const [comboData, setComboData] = useState(() => normalizeCombo(initialData));
      const [activeRouteId, setActiveRouteId] = useState('main');
      const [selectedMove, setSelectedMove] = useState(null); // {routeId, index}
      const draggedPreviewRef = useRef(null);
      const [dragOverMove, setDragOverMove] = useState(null);
      useEffect(() => {
        setComboData(normalizeCombo(initialData));
        setActiveRouteId('main');
        setSelectedMove(null);
      }, [initialData.id]);
      if (!isOpen) return null;

      const currentCategoryMoves = moves.filter(m => m.category === activeCategory);
      const activeBranch = comboData.branches.find(branch => branch.id === activeRouteId);
      const activeMoveIds = activeBranch ? activeBranch.moveIds : comboData.moveIds;
      const getMove = id => moves.find(m => m.id === id || m.overrideId === id);
      const modifyRoute = fn => setComboData(prev => {
        if (activeRouteId === 'main') return { ...prev, moveIds: fn(prev.moveIds) };
        return { ...prev, branches: prev.branches.map(branch => branch.id === activeRouteId ? { ...branch, moveIds: fn(branch.moveIds) } : branch) };
      });
      const chooseRoute = id => { setActiveRouteId(id); setSelectedMove(null); setDragOverMove(null); };
      const renameBranch = (id, title) => {
        setComboData(prev => ({ ...prev, branches: prev.branches.map(branch =>
          branch.id === id ? { ...branch, title } : branch
        ) }));
      };
      const branchLabel = branch => String(branch?.title || '').trim() ||
        `分岐${comboData.branches.findIndex(item => item.id === branch?.id) + 1}`;
      // The selected move is replaced in-place; an unselected move is appended.
      const handleChooseMove = moveId => {
        const index = selectedMove?.routeId === activeRouteId ? selectedMove.index : -1;
        if (index >= 0 && index < activeMoveIds.length) {
          modifyRoute(ids => ids.map((id, i) => i === index ? moveId : id));
        } else {
          modifyRoute(ids => [...ids, moveId]);
        }
        setSelectedMove(null);
      };
      // Reanchor only the direct children of the route being edited.
      const updateChildAnchors = (allBranches, parentId, fn) => allBranches.map(branch =>
        (branch.parentId || 'main') === parentId ? { ...branch, fromIndex: fn(Number(branch.fromIndex) || 0) } : branch);
      const handleRemoveSelected = () => {
        if (!selectedMove || selectedMove.routeId !== activeRouteId) return;
        const at = selectedMove.index;
        setComboData(prev => {
          const oldIds = activeRouteId === 'main' ? prev.moveIds : prev.branches.find(b => b.id === activeRouteId)?.moveIds || [];
          if (at < 0 || at >= oldIds.length) return prev;
          const nextIds = oldIds.filter((_, i) => i !== at);
          const nextBranches = updateChildAnchors(prev.branches, activeRouteId, anchor =>
            Math.max(0, Math.min(nextIds.length ? nextIds.length - 1 : 0, anchor - (at < anchor ? 1 : 0))));
          if (activeRouteId === 'main') return { ...prev, moveIds: nextIds, branches: nextBranches };
          return { ...prev, branches: nextBranches.map(b => b.id === activeRouteId ? { ...b, moveIds: nextIds } : b) };
        });
        setSelectedMove(null);
      };
      const addBranchAtSelection = () => {
        if (!selectedMove || selectedMove.routeId !== activeRouteId) return;
        const id = createId();
        setComboData(prev => ({ ...prev, branches: [...prev.branches, {
          id, parentId: activeRouteId, fromIndex: selectedMove.index, moveIds: [],
          title: `分岐${prev.branches.length + 1}`,
          dmg: '', situation: '', selectionSituation: ''
        }] }));
        setActiveRouteId(id);
        setSelectedMove(null);
      };
      const deleteActiveBranch = () => {
        if (activeRouteId === 'main') return;
        const parentId = activeBranch?.parentId || 'main';
        setComboData(prev => {
          const removeIds = new Set([activeRouteId]);
          let changed = true;
          while (changed) {
            changed = false;
            for (const branch of prev.branches) {
              if (!removeIds.has(branch.id) && removeIds.has(branch.parentId)) {
                removeIds.add(branch.id); changed = true;
              }
            }
          }
          return { ...prev, branches: prev.branches.filter(branch => !removeIds.has(branch.id)) };
        });
        chooseRoute(parentId);
      };
      const reorderBranch = (id, direction) => {
        setComboData(prev => {
          const branch = prev.branches.find(b => b.id === id);
          if (!branch) return prev;
          const siblings = prev.branches.filter(b => (b.parentId || 'main') === (branch.parentId || 'main'));
          const index = siblings.findIndex(b => b.id === id);
          const other = siblings[index + direction];
          if (!other) return prev;
          const next = [...prev.branches];
          const a = next.findIndex(b => b.id === id);
          const b = next.findIndex(item => item.id === other.id);
          [next[a], next[b]] = [next[b], next[a]];
          return { ...prev, branches: next };
        });
      };
      const reorderPreview = (from, to) => {
        if (from === to) return;
        setComboData(prev => {
          const oldIds = activeRouteId === 'main' ? prev.moveIds : prev.branches.find(b => b.id === activeRouteId)?.moveIds || [];
          if (from < 0 || to < 0 || from >= oldIds.length || to >= oldIds.length) return prev;
          const nextIds = [...oldIds];
          const originalIndexes = oldIds.map((_, i) => i);
          nextIds.splice(to, 0, nextIds.splice(from, 1)[0]);
          originalIndexes.splice(to, 0, originalIndexes.splice(from, 1)[0]);
          const nextBranches = updateChildAnchors(prev.branches, activeRouteId, index => {
            const next = originalIndexes.indexOf(index);
            return next === -1 ? Math.min(index, nextIds.length - 1) : next;
          });
          return activeRouteId === 'main'
            ? { ...prev, moveIds: nextIds, branches: nextBranches }
            : { ...prev, branches: nextBranches.map(b => b.id === activeRouteId ? { ...b, moveIds: nextIds } : b) };
        });
        setSelectedMove(null);
      };
      const onPreviewDragStart = (e, index) => {
        draggedPreviewRef.current = { routeId: activeRouteId, index };
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('application/x-sf6-combo', JSON.stringify(draggedPreviewRef.current));
        e.dataTransfer.setData('text/plain', String(index));
      };
      const onPreviewDrop = (e, index) => {
        e.preventDefault(); e.stopPropagation();
        const dragged = draggedPreviewRef.current;
        draggedPreviewRef.current = null; setDragOverMove(null);
        if (dragged?.routeId !== activeRouteId) return;
        reorderPreview(dragged.index, index);
      };
      const changeField = (name, value) => setComboData(prev => {
        if (!activeBranch || name === 'state') return { ...prev, [name]: value };
        return { ...prev, branches: prev.branches.map(branch => branch.id === activeRouteId ? { ...branch, [name]: value } : branch) };
      });
      const handleChange = event => changeField(event.target.name, event.target.value);
      const [isSaving, setIsSaving] = useState(false);
      const handleSubmitCombo = async () => {
        if (isSaving) return;
        setIsSaving(true);
        try { await onSave({ ...comboData, state: comboData.state === '通常' ? 'ノーマル' : comboData.state }); }
        catch (error) { console.error('Combo save failed:', error); alert(`コンボを保存できませんでした: ${error.message}`); }
        finally { setIsSaving(false); }
      };
      const drawPreview = ids => ids.map((mid, idx) => {
        const move = getMove(mid);
        const selected = selectedMove?.routeId === activeRouteId && selectedMove.index === idx;
        return <React.Fragment key={`${mid}-${idx}`}>
          <div draggable="true" onDragStart={e => onPreviewDragStart(e, idx)}
            onDragEnd={() => { draggedPreviewRef.current = null; setDragOverMove(null); }}
            onDragOver={e => { if (draggedPreviewRef.current?.routeId === activeRouteId) { e.preventDefault(); setDragOverMove(idx); } }}
            onDrop={e => onPreviewDrop(e, idx)}
            className={`relative inline-flex flex-col items-start gap-1 rounded-md p-1 cursor-grab active:cursor-grabbing ${selected ? 'ring-2 ring-cyan-400 bg-cyan-900/30' : dragOverMove === idx ? 'ring-2 ring-amber-400' : ''}`}>
            <button type="button" onClick={() => setSelectedMove(selected ? null : {routeId: activeRouteId, index: idx})}
              title="クリックで技を選択・ドラッグで順序変更" className="inline-flex items-center">
              {move ? <MoveTile minimal move={move} showMoveName /> : <span className="bg-red-900/50 text-red-200 px-2 py-1 rounded text-xs">Missing</span>}
            </button>
            {selected && <div className="flex items-center gap-1" onMouseDown={e => e.stopPropagation()}>
              <button type="button" onClick={addBranchAtSelection}
                className="px-2 py-0.5 text-[11px] rounded bg-cyan-800 hover:bg-cyan-700 text-white">分岐</button>
              <button type="button" onClick={handleRemoveSelected}
                className="px-2 py-0.5 text-[11px] rounded bg-red-900 hover:bg-red-800 text-white">削除</button>
            </div>}
          </div>
          {idx < ids.length - 1 && String(move?.name || '').trim().toUpperCase() !== 'CDR' && <ChevronRight size={16} className="text-slate-500 shrink-0" />}
        </React.Fragment>;
      });

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="コンボ編集" maxWidth="max-w-3xl">
          <div className="flex flex-col h-[72vh] min-h-[420px]">
            <div className="mb-3 flex flex-wrap gap-2 items-center shrink-0">
              <button type="button" onClick={() => chooseRoute('main')}
                className={`px-3 py-1.5 text-xs rounded-md border ${activeRouteId === 'main' ? 'bg-cyan-900/70 border-cyan-600 text-cyan-100' : 'border-slate-700 text-slate-300 hover:bg-slate-800'}`}>メインルート</button>
              {comboData.branches.map((branch, index) => <div key={branch.id} className="inline-flex items-center rounded-md border border-slate-700 overflow-hidden">
                <div className="flex flex-col border-r border-slate-700">
                  <button type="button" disabled={!comboData.branches.slice(0, index).some(b => (b.parentId || 'main') === (branch.parentId || 'main'))} onClick={() => reorderBranch(branch.id, -1)} title="分岐を上へ" aria-label={`分岐${index + 1}を上へ`}
                    className="px-1 text-slate-400 hover:text-cyan-300 disabled:opacity-25"><ChevronUp size={12} /></button>
                  <button type="button" disabled={!comboData.branches.slice(index + 1).some(b => (b.parentId || 'main') === (branch.parentId || 'main'))} onClick={() => reorderBranch(branch.id, 1)} title="分岐を下へ" aria-label={`分岐${index + 1}を下へ`}
                    className="px-1 text-slate-400 hover:text-cyan-300 disabled:opacity-25"><ChevronDown size={12} /></button>
                </div>
                <button type="button" onClick={() => chooseRoute(branch.id)}
                  className={`px-3 py-1.5 text-xs ${activeRouteId === branch.id ? 'bg-cyan-900/70 text-cyan-100' : 'text-slate-300 hover:bg-slate-800'}`}>{branchLabel(branch)}</button>
              </div>)}
              {activeBranch && <button type="button" onClick={deleteActiveBranch} className="px-2 py-1.5 text-xs text-red-400 hover:text-red-300 ml-auto"><Trash2 size={13} className="inline mr-1"/>分岐削除</button>}
            </div>
            {activeBranch && <div className="mb-3 shrink-0">
              <label htmlFor="active-branch-title" className="block text-xs font-medium text-slate-400 mb-1">分岐名</label>
              <input id="active-branch-title" type="text"
                value={activeBranch.title ?? ''}
                onChange={event => renameBranch(activeRouteId, event.target.value)}
                placeholder={branchLabel(activeBranch)}
                className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-cyan-500" />
            </div>}
            <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 mb-4 shrink-0 shadow-inner">
              <div className="text-xs text-slate-500 mb-2 uppercase tracking-wide font-semibold">プレビュー {activeBranch ? '（分岐ルート）' : '（メインルート）'}</div>
              {activeBranch && <div className="text-xs text-slate-400 mb-2">親ルート: {activeBranch.parentId && activeBranch.parentId !== 'main' ? branchLabel(comboData.branches.find(b => b.id === activeBranch.parentId)) : 'メインルート'} ／ 共通部分: {((activeBranch.parentId && activeBranch.parentId !== 'main' ? comboData.branches.find(b => b.id === activeBranch.parentId)?.moveIds : comboData.moveIds) || []).slice(0, Math.max(0, Number(activeBranch.fromIndex) || 0)).map(id => getMove(id)?.name || 'Unknown Move').join(' > ') || 'なし'}</div>}
              <div className="flex flex-wrap items-center gap-2 min-h-[40px]">
                {activeMoveIds.length === 0 && <span className="text-slate-600 text-sm italic">下の技一覧から追加してください。</span>}
                {drawPreview(activeMoveIds)}
              </div>
              {selectedMove?.routeId === activeRouteId && <p className="mt-2 text-[11px] text-cyan-300">技を選択中：下の技一覧をクリックすると選択した技を上書きします。ドラッグで順番を変更できます。</p>}
            </div>
            <div className="flex-1 flex flex-col min-h-0 border border-slate-800 rounded-lg overflow-hidden mb-4">
              <div className="character-scroll flex overflow-x-auto bg-slate-950 border-b border-slate-800 shrink-0">
                {CATEGORIES.map(cat => (
                  <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-3 py-2 text-xs font-medium whitespace-nowrap transition-colors ${activeCategory === cat ? 'bg-cyan-900/30 text-cyan-400 border-b-2 border-cyan-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>{cat}</button>
                ))}
              </div>
              <div className="character-scroll flex-1 overflow-y-auto p-3 bg-slate-900/50">
                <div className="flex flex-wrap gap-2">
                  {currentCategoryMoves.map(move => <button key={move.id} type="button" onClick={() => handleChooseMove(move.overrideId || move.id)}
                    className={`px-3 py-1.5 rounded-md text-sm font-bold border shadow-sm transition-all hover:scale-105 active:scale-95 ${move.category === 'SA' || /^(?:SA[123]?|CA)$/i.test(String(move.name || '').trim()) ? 'bg-purple-300 text-purple-950 border-purple-400' : (STRENGTH_COLORS[move.strength] || STRENGTH_COLORS['その他'])}`}>
                    {MOVE_NAME_CATEGORIES.includes(move.category) && move.moveName && move.moveName.trim() !== String(move.name || '').trim() ? `${move.name}（${move.moveName}）` : move.name}
                  </button>)}
                  {currentCategoryMoves.length === 0 && <div className="w-full text-center text-slate-500 text-sm py-4">No moves found in this category.</div>}
                </div>
              </div>
            </div>
            <div className="character-scroll grid grid-cols-1 sm:grid-cols-2 gap-3 shrink-0 pt-2 border-t border-slate-800 max-h-[190px] overflow-y-auto">
              {!activeBranch && <div><label className="block text-xs font-medium text-slate-400 mb-1">ヒット</label>
                <select name="state" value={comboData.state === '通常' ? 'ノーマル' : (comboData.state || 'ノーマル')} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm">{COMBO_STATES.map(state => <option key={state} value={state}>{state}</option>)}</select></div>}
              <div><label className="block text-xs font-medium text-slate-400 mb-1">ダメージ（任意）</label>
                <input type="text" name="dmg" value={(activeBranch || comboData).dmg || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm" /></div>
              <div><label className="block text-xs font-medium text-slate-400 mb-1">コンボ選択場面（任意）</label>
                <input type="text" name="selectionSituation" value={(activeBranch || comboData).selectionSituation || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm" placeholder="ex. 立ち確認、Dゲージ3本 etc." /></div>
              <div><label className="block text-xs font-medium text-slate-400 mb-1">コンボ後の状況（任意）</label>
                <input type="text" name="situation" value={(activeBranch || comboData).situation || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm" placeholder="ex. 2中P消費で+4F etc." /></div>
            </div>
            <div className="pt-3 mt-2 flex justify-end space-x-2 shrink-0">
              <button onClick={onClose} className="px-4 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-slate-800">キャンセル</button>
              <button onClick={handleSubmitCombo} disabled={isSaving} className="flex items-center px-4 py-2 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white"><Save size={16} className="mr-2" /> {isSaving ? '保存中...' : '保存'}</button>
            </div>
          </div>
        </Modal>
      );
    }

    class DisplayErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error('SF6 Storage Box render error:', error, info); }
      render() {
        if (!this.state.error) return this.props.children;
        return <div className="min-h-screen bg-slate-900 text-slate-200 flex items-center justify-center p-6"><div className="max-w-xl rounded-xl border border-red-700 bg-slate-950 p-6"><h1 className="text-xl font-bold text-red-400 mb-3">SF6 Storage Box 表示エラー</h1><p className="text-sm mb-3">表示処理でエラーが発生しました。以下の内容をお知らせください。</p><pre className="whitespace-pre-wrap break-all text-xs text-red-200">{String(this.state.error?.message || this.state.error)}</pre></div></div>;
      }
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<DisplayErrorBoundary><App /></DisplayErrorBoundary>);
  </script>
</body>
</html>
